<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="680" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#131d33" />
      <stop offset="100%" stop-color="#0e1728" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="680" rx="16" fill="url(#bgGrad)" />
  <rect x="1" y="1" width="1198" height="678" rx="15" stroke="#1f293d" stroke-width="2" />

  <!-- Window Header -->
  <rect x="0" y="0" width="1200" height="56" rx="16" fill="#0e1626" />
  <circle cx="36" cy="28" r="6" fill="#ef4444" />
  <circle cx="56" cy="28" r="6" fill="#f59e0b" />
  <circle cx="76" cy="28" r="6" fill="#10b981" />
  
  <rect x="240" y="14" width="720" height="28" rx="6" fill="#080d18" stroke="#1f293d" stroke-width="1" />
  <text x="600" y="33" fill="#94a3b8" font-family="Inter, sans-serif" font-size="13" text-anchor="middle">https://hemo-scan--srbilal12.replit.app/ — Research Prototype</text>

  <!-- Top App Navigation -->
  <g transform="translate(60, 80)">
    <text x="0" y="32" fill="#f1f5f9" font-family="Sora, sans-serif" font-size="24" font-weight="700">HemoScan</text>
    <rect x="140" y="14" width="220" height="24" rx="12" fill="#064e3b" stroke="#059669" stroke-width="1" />
    <text x="250" y="30" fill="#34d399" font-family="Inter, sans-serif" font-size="11" font-weight="600" text-anchor="middle">AI PHOTOPLETHYSMOGRAPHY (PPG)</text>

    <!-- Medical Disclaimer Banner -->
    <rect x="520" y="10" width="560" height="32" rx="6" fill="#451a03" stroke="#b45309" stroke-width="1" />
    <text x="536" y="31" fill="#fef3c7" font-family="Inter, sans-serif" font-size="12" font-weight="600">⚠️ Disclaimer: Research prototype only. Not certified for clinical diagnosis.</text>
  </g>

  <!-- Main Content Grid -->
  <g transform="translate(60, 140)">
    <!-- Left Column: Camera / Optical Sensor View -->
    <rect x="0" y="0" width="520" height="460" rx="12" fill="url(#panelGrad)" stroke="#1e293b" stroke-width="1" />
    
    <!-- Viewport Frame -->
    <rect x="24" y="24" width="472" height="280" rx="8" fill="#040711" stroke="#334155" stroke-width="1" />
    
    <!-- Optical sensor target circle -->
    <circle cx="260" cy="164" r="85" fill="#1e1014" stroke="#e11d48" stroke-width="2" stroke-dasharray="6 4" />
    <circle cx="260" cy="164" r="45" fill="#3f121d" stroke="#f43f5e" stroke-width="1.5" />
    <circle cx="260" cy="164" r="12" fill="#e11d48" />

    <text x="260" y="120" fill="#fda4af" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" font-weight="500">Fingertip Capillary Zone</text>
    <text x="260" y="224" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">LED Flash Transmission Active</text>

    <!-- Signal Metrics -->
    <g transform="translate(24, 324)">
      <rect x="0" y="0" width="144" height="68" rx="8" fill="#090e1a" stroke="#1e293b" stroke-width="1" />
      <text x="14" y="24" fill="#64748b" font-family="Inter, sans-serif" font-size="11">R/G Intensity Ratio</text>
      <text x="14" y="52" fill="#f8fafc" font-family="Sora, sans-serif" font-size="20" font-weight="700">1.482</text>

      <rect x="164" y="0" width="144" height="68" rx="8" fill="#090e1a" stroke="#1e293b" stroke-width="1" />
      <text x="178" y="24" fill="#64748b" font-family="Inter, sans-serif" font-size="11">Sampling Quality</text>
      <text x="178" y="52" fill="#10b981" font-family="Sora, sans-serif" font-size="20" font-weight="700">Optimal</text>

      <rect x="328" y="0" width="144" height="68" rx="8" fill="#090e1a" stroke="#1e293b" stroke-width="1" />
      <text x="342" y="24" fill="#64748b" font-family="Inter, sans-serif" font-size="11">Optical Frame Rate</text>
      <text x="342" y="52" fill="#38bdf8" font-family="Sora, sans-serif" font-size="20" font-weight="700">60 FPS</text>
    </g>

    <!-- Right Column: PPG Spectral Waveform & Estimation -->
    <rect x="560" y="0" width="520" height="460" rx="12" fill="url(#panelGrad)" stroke="#1e293b" stroke-width="1" />

    <text x="584" y="38" fill="#f8fafc" font-family="Sora, sans-serif" font-size="16" font-weight="600">Photoplethysmography Waveform Analysis</text>
    <text x="584" y="58" fill="#64748b" font-family="Inter, sans-serif" font-size="12">Pulsatile microvascular light absorption signal</text>

    <!-- Waveform Graph Area -->
    <rect x="584" y="78" width="472" height="150" rx="8" fill="#060a14" stroke="#1e293b" stroke-width="1" />
    
    <!-- Grid lines -->
    <line x1="584" y1="115" x2="1056" y2="115" stroke="#131e33" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="584" y1="153" x2="1056" y2="153" stroke="#131e33" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="584" y1="190" x2="1056" y2="190" stroke="#131e33" stroke-width="1" stroke-dasharray="4 4" />

    <!-- Waveform path -->
    <path d="M 590 160 Q 610 140, 625 155 T 660 120 T 695 170 T 730 115 T 765 175 T 800 110 T 835 168 T 870 122 T 905 174 T 940 118 T 975 170 T 1010 124 T 1045 160" 
          fill="none" stroke="url(#waveGrad)" stroke-width="2.5" stroke-linecap="round" />

    <!-- Estimated Result Card -->
    <rect x="584" y="248" width="472" height="110" rx="8" fill="#080e1c" stroke="#10b981" stroke-width="1.5" />
    <text x="608" y="280" fill="#94a3b8" font-family="Inter, sans-serif" font-size="12" font-weight="500">ESTIMATED HEMOGLOBIN (Hb)</text>
    <text x="608" y="324" fill="#f8fafc" font-family="Sora, sans-serif" font-size="34" font-weight="700">14.2 <tspan font-size="16" fill="#94a3b8">g/dL</tspan></text>
    
    <rect x="910" y="278" width="124" height="28" rx="6" fill="#064e3b" />
    <text x="972" y="296" fill="#34d399" font-family="Inter, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Within Normal Range</text>

    <!-- Reference Spectrum Indicator -->
    <g transform="translate(584, 380)">
      <text x="0" y="16" fill="#64748b" font-family="Inter, sans-serif" font-size="11">Clinical Reference Baseline (g/dL):</text>
      
      <!-- Range bar -->
      <rect x="0" y="26" width="118" height="8" rx="3" fill="#dc2626" />
      <rect x="118" y="26" width="118" height="8" rx="0" fill="#f59e0b" />
      <rect x="236" y="26" width="118" height="8" rx="0" fill="#10b981" />
      <rect x="354" y="26" width="118" height="8" rx="3" fill="#3b82f6" />

      <text x="0" y="52" fill="#64748b" font-family="Inter, sans-serif" font-size="10">&lt; 8.0 (Severe)</text>
      <text x="118" y="52" fill="#64748b" font-family="Inter, sans-serif" font-size="10">8.0 - 10.9 (Mod)</text>
      <text x="236" y="52" fill="#64748b" font-family="Inter, sans-serif" font-size="10">12.0 - 16.0 (Normal)</text>
      <text x="380" y="52" fill="#64748b" font-family="Inter, sans-serif" font-size="10">&gt; 16.0 (High)</text>
    </g>

  </g>
</svg>
